syntax = "proto3";

package qqbridge.v1;

// 单所有者账号 + 每台设备一个令牌（docs/design.md 4.10）。除 Login 外都需要 Authorization: Bearer <token>。
service AuthService {
  rpc Login(LoginRequest) returns (LoginResponse);
  // 吊销当前设备的令牌。
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc ListDevices(ListDevicesRequest) returns (ListDevicesResponse);
  rpc RevokeDevice(RevokeDeviceRequest) returns (RevokeDeviceResponse);
  // 登记本设备的推送令牌（APNs 普通推送和 VoIP 推送）。令牌变化时（例如重装 App）重新调用；传空表示取消。
  rpc RegisterPush(RegisterPushRequest) returns (RegisterPushResponse);
  // 账号级设置（目前只有「通知手机」）。改完经 pts 推给所有设备（Difference.settings / SubscribeResponse.settings）。
  rpc SetAccountSettings(SetAccountSettingsRequest) returns (SetAccountSettingsResponse);
  // 本设备在线、要求暂停手机通知（Mac「本机在线时自动停用通知到手机」）。开着这个选项时每 30 秒报一次，
  // 服务端 75 秒没收到就当离线、恢复通知；关掉选项或退出 App 时报 mute_phone = false。
  // 用租约而不看 Subscribe 连接：Mac 睡眠时连接在服务端可能挂好几分钟才断。
  rpc ReportPresence(ReportPresenceRequest) returns (ReportPresenceResponse);
}

message LoginRequest {
  string username = 1;
  string password = 2;
  string device_name = 3;
  string platform = 4;
}

message LoginResponse {
  string token = 1;
  int64 account_id = 2;
  int64 device_id = 3;
}

message LogoutRequest {}

message LogoutResponse {}

message ListDevicesRequest {}

message ListDevicesResponse {
  repeated Device devices = 1;
}

message Device {
  int64 id = 1;
  string name = 2;
  string platform = 3;
  int64 created_at = 4;
  int64 last_seen_at = 5;
  bool current = 6;
}

message RevokeDeviceRequest {
  int64 device_id = 1;
}

message RevokeDeviceResponse {
  bool revoked = 1;
}

enum ApnsEnvironment {
  APNS_ENVIRONMENT_UNSPECIFIED = 0;
  APNS_ENVIRONMENT_SANDBOX = 1;
  APNS_ENVIRONMENT_PRODUCTION = 2;
}

message RegisterPushRequest {
  // 十六进制设备令牌。
  string apns_token = 1;
  string apns_voip_token = 2;
  ApnsEnvironment environment = 3;
}

message RegisterPushResponse {}

// 账号级设置：所有设备共享，存在服务端，经 pts 同步。字段都按「零值 = 默认行为」取名，旧客户端不受影响。
message AccountSettings {
  // true = 不给手机（iOS / iPadOS 设备）发新消息的通知推送；Mac 照常。来电、已读同步不受影响。
  bool phone_notifications_off = 1;
  // 只读（服务端算的）：有设备开了「在线时自动停用」且正在线，手机通知暂停中。
  // 实际是否推手机 = !phone_notifications_off && !phone_auto_off。客户端写入时忽略这个字段。
  bool phone_auto_off = 2;
}

message SetAccountSettingsRequest {
  AccountSettings settings = 1;
  // true = 同时解除当前的「在线自动停用」，直到那些设备下线（手机上点「打开」时用）。
  bool override_auto_off = 2;
}

message SetAccountSettingsResponse {
  // 改后的设置和它的 pts（客户端可直接应用，也会从 Subscribe 再收到一次）。
  AccountSettings settings = 1;
  int64 pts = 2;
}

message ReportPresenceRequest {
  // true = 本设备在线，暂停手机通知；false = 不再要求（选项关了、App 退出）。
  bool mute_phone = 1;
}

message ReportPresenceResponse {}
