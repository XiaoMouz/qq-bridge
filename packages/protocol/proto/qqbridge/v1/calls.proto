syntax = "proto3";

package qqbridge.v1;

// 通话（docs/design.md 5.4）：QQ 来电经通话桥（NapCat 插件 + AV Host）到服务端，
// 客户端接听时服务端建 LiveKit 房间、让通话网关以"QQ 端"身份入会，客户端拿令牌入会即可通话。
// 振铃、接通、结束等状态经 Subscribe 的 CallUpdate 实时推送（临时事件，不占 pts）；
// 通话结束后在会话里留一条 kind = "call" 的服务事件作为通话记录。

enum CallPhase {
  CALL_PHASE_UNSPECIFIED = 0;
  CALL_PHASE_RINGING = 1;
  // 已发出接听，等 QQ 那边接通。
  CALL_PHASE_ACCEPTING = 2;
  CALL_PHASE_CONNECTED = 3;
  CALL_PHASE_ENDED = 4;
}

enum CallMedia {
  CALL_MEDIA_UNSPECIFIED = 0;
  CALL_MEDIA_VOICE = 1;
  CALL_MEDIA_VIDEO = 2;
}

message Call {
  // 通话桥分配的 id（每通来电一个）。
  string id = 1;
  CallPhase phase = 2;
  CallMedia media = 3;
  bool incoming = 4;
  int64 peer_uin = 5;
  string peer_name = 6;
  int64 invite_at = 7;
  int64 connected_at = 8;
  int64 ended_at = 9;
  // QQ 内核给的结束原因（原样）。
  int32 end_reason = 10;
  // 由哪台设备接听（0：没有经本系统接听）。
  int64 answered_device_id = 11;
  // 群语音所在的群号（0 = 1 对 1 通话）。peer_uin 是邀请人。
  int64 group_id = 12;
}

message GetActiveCallRequest {}

message GetActiveCallResponse {
  // 没有进行中的通话时不设置。
  optional Call call = 1;
}

message AnswerCallRequest {
  string call_id = 1;
}

message AnswerCallResponse {
  Call call = 1;
  // 客户端用这两个值加入 LiveKit 房间；网关已经在房间里了。
  string livekit_url = 2;
  string livekit_token = 3;
  string room = 4;
}

message ListCallsRequest {
  int32 limit = 1;
  // 翻页：只返回 invite_at 早于它的（秒）。
  int64 before = 2;
}

message ListCallsResponse {
  repeated Call calls = 1;
}

message HangupCallRequest {
  string call_id = 1;
}

// 结束状态随后经 Subscribe 的 CallUpdate 推送（QQ 那边确认，或 3 秒后自行记为结束）。
message HangupCallResponse {
  Call call = 1;
}

message StartCallRequest {
  // 打给谁（好友的 QQ 号）。只支持 1 对 1 语音。
  int64 peer_uin = 1;
}

// 和接听一样：拿着地址和令牌进房间（网关已经在里面了），对方接了就能说话。
message StartCallResponse {
  Call call = 1;
  string livekit_url = 2;
  string livekit_token = 3;
  string room = 4;
}

service CallService {
  // 打出去（1 对 1 语音）：呼叫状态（响铃、接通、结束）照常经 CallUpdate 推送。
  rpc StartCall(StartCallRequest) returns (StartCallResponse);
  rpc GetActiveCall(GetActiveCallRequest) returns (GetActiveCallResponse);
  rpc AnswerCall(AnswerCallRequest) returns (AnswerCallResponse);
  // 挂断：还在响铃就是拒接，已经接了就是结束通话（QQ 那边对方会看到通话结束）。
  rpc HangupCall(HangupCallRequest) returns (HangupCallResponse);
  rpc ListCalls(ListCallsRequest) returns (ListCallsResponse);
}
