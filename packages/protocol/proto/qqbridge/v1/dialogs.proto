syntax = "proto3";

package qqbridge.v1;

import "qqbridge/v1/common.proto";

service DialogService {
  // 按顶部消息时间倒序分页的会话列表（首次进入 App 时用；之后的变化走 SyncService）。
  rpc ListDialogs(ListDialogsRequest) returns (ListDialogsResponse);
  // 标记已读到 max_seq；服务端同时回写 QQ，并经 pts 同步给其他设备。
  rpc MarkRead(MarkReadRequest) returns (MarkReadResponse);
  // 置顶（只在本服务的客户端之间同步，不改 QQ 里的置顶）。
  rpc SetPinned(SetPinnedRequest) returns (SetPinnedResponse);
  // 通知策略：default（私聊全部推送，群聊只推 @我 和回复我的）/ all（接收并提醒）/ mentions / muted（接收不提醒）
  // / archived（收进群助手：不提醒，会话列表里收进"群助手"）。最初从 QQ 的群消息设置同步过来，在这里改过之后以这里为准。
  rpc SetNotifyPolicy(SetNotifyPolicyRequest) returns (SetNotifyPolicyResponse);
  // @全体成员 是否提醒（默认提醒）。
  rpc SetMentionAllNotify(SetMentionAllNotifyRequest) returns (SetMentionAllNotifyResponse);
  // 保存草稿（segments 为空表示清除），经 pts 同步到其他设备。
  rpc SaveDraft(SaveDraftRequest) returns (SaveDraftResponse);
  // 告诉服务端这台设备正在看哪个会话（chat_id = 0 表示退出会话）。服务端据此优先下载该会话的媒体。
  // 服务端只在内存里保留 2 分钟，客户端停留期间每分钟刷新一次。
  rpc SetActiveChat(SetActiveChatRequest) returns (SetActiveChatResponse);
  // 让对方看到"正在输入"（只有私聊支持；群聊直接忽略）。客户端在输入时每几秒调用一次，服务端会限流。
  rpc SetTyping(SetTypingRequest) returns (SetTypingResponse);
  // 和某个好友 / 群发起会话：会话还不存在时新建（经 pts 推给所有设备），返回会话 id。
  rpc OpenChat(OpenChatRequest) returns (OpenChatResponse);
}

message OpenChatRequest {
  Scene scene = 1;
  int64 peer_id = 2;
}

message OpenChatResponse {
  int64 chat_id = 1;
}

message ListDialogsRequest {
  uint32 limit = 1;
  // 上一页最后一个会话，用于翻页；首页留空。
  int64 before_chat_id = 2;
  int64 before_top_time = 3;
}

message ListDialogsResponse {
  int64 pts = 1;
  repeated Dialog dialogs = 2;
}

message MarkReadRequest {
  int64 chat_id = 1;
  int64 max_seq = 2;
}

message MarkReadResponse {
  bool changed = 1;
}

message SetActiveChatRequest {
  int64 chat_id = 1;
}

message SetActiveChatResponse {}

message SetPinnedRequest {
  int64 chat_id = 1;
  bool pinned = 2;
}

message SetPinnedResponse {
  bool changed = 1;
}

message SetNotifyPolicyRequest {
  int64 chat_id = 1;
  string policy = 2;
}

message SetNotifyPolicyResponse {
  bool changed = 1;
}

message SaveDraftRequest {
  int64 chat_id = 1;
  repeated OutgoingSegment segments = 2;
  int64 reply_to_seq = 3;
}

message SaveDraftResponse {
  bool changed = 1;
}

message SetTypingRequest {
  int64 chat_id = 1;
}

message SetTypingResponse {
  // false：群聊、QQ 离线或被限流，没有发出去。
  bool sent = 1;
}

message SetMentionAllNotifyRequest {
  int64 chat_id = 1;
  bool enabled = 2;
}

message SetMentionAllNotifyResponse {
  bool changed = 1;
}
