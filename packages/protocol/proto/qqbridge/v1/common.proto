// QQ Bridge 客户端协议 v1（草案：P0 样本分析完成后冻结，见 docs/design.md 第 7 节）。
// 所有时间字段都是 unix 秒；所有 *_pts / version 字段都是同步序号（见 docs/design.md 4.7）。
syntax = "proto3";

package qqbridge.v1;

// 会话场景（与 Milky 对齐）。
enum Scene {
  SCENE_UNSPECIFIED = 0;
  SCENE_FRIEND = 1;
  SCENE_GROUP = 2;
  SCENE_TEMP = 3;
}

enum PeerKind {
  PEER_KIND_UNSPECIFIED = 0;
  PEER_KIND_USER = 1;
  PEER_KIND_GROUP = 2;
}

enum MediaKind {
  MEDIA_KIND_UNSPECIFIED = 0;
  MEDIA_KIND_IMAGE = 1;
  MEDIA_KIND_VIDEO = 2;
  MEDIA_KIND_AUDIO = 3;
  MEDIA_KIND_FILE = 4;
  MEDIA_KIND_STICKER = 5;
}

enum MediaState {
  MEDIA_STATE_UNSPECIFIED = 0;
  // 还没下载到服务端。
  MEDIA_STATE_PENDING = 1;
  // 已存在服务端，可以按 sha256 取。
  MEDIA_STATE_STORED = 2;
  MEDIA_STATE_FAILED = 3;
  // QQ 那边的链接已过期，拿不到了。
  MEDIA_STATE_EXPIRED = 4;
  // 按策略没有下载（例如超过大小上限）。
  MEDIA_STATE_SKIPPED = 5;
  // 原件已按保留策略清理，只剩缩略图与预览。
  MEDIA_STATE_PURGED = 6;
  // 按需：这个会话设为不自动下载（免打扰、群助手里的群），客户端显示到 / 点开时用 RequestMedia 要。
  MEDIA_STATE_ON_DEMAND = 7;
}

enum MessageState {
  MESSAGE_STATE_UNSPECIFIED = 0;
  MESSAGE_STATE_NORMAL = 1;
  // 已撤回：内容仍然保留（防撤回），客户端自行决定是否显示。
  MESSAGE_STATE_RECALLED = 2;
}

enum MessageKind {
  MESSAGE_KIND_UNSPECIFIED = 0;
  MESSAGE_KIND_NORMAL = 1;
  // 系统提示，例如戳一戳、群成员变动。
  MESSAGE_KIND_SERVICE = 2;
  // 通话记录。
  MESSAGE_KIND_CALL = 3;
}

// 消息段里的媒体信息。下载完成后 state 变为 STORED 并带上 sha256（通过 chat_pts 更新推送）。
message MediaInfo {
  uint32 ord = 1;
  MediaState state = 2;
  // 原件的 sha256。客户端只在"查看原图 / 保存 / 分享"时才下载原件。
  string sha256 = 3;
  uint64 size = 4;
  string mime = 5;
  // 极小的模糊占位图（base64），收到消息就能先画出轮廓。
  string thumbhash = 6;
  // 缩略图（约 320px）与预览图（约 1280px）的 sha256，用 MediaService.SignMediaUrls 换链接。
  string thumb_sha256 = 7;
  string preview_sha256 = 8;
  uint32 width = 9;
  uint32 height = 10;
  // 客户端能直接播放 / 边下边播的版本（语音：AAC m4a；视频：faststart mp4；原件本身就合适时等于原件的 sha256）。
  string playable_sha256 = 11;
  // 语音波形：64 个 0–255 的振幅。
  bytes waveform = 12;
}

// 规范化消息段，与 Milky 的 IncomingSegment 一一对应；未知类型保留原文。
message Segment {
  oneof kind {
    TextSegment text = 1;
    MentionSegment mention = 2;
    MentionAllSegment mention_all = 3;
    FaceSegment face = 4;
    ReplySegment reply = 5;
    ImageSegment image = 6;
    RecordSegment record = 7;
    VideoSegment video = 8;
    FileSegment file = 9;
    ForwardSegment forward = 10;
    MarketFaceSegment market_face = 11;
    LightAppSegment light_app = 12;
    XmlSegment xml = 13;
    MarkdownSegment markdown = 14;
    UnknownSegment unknown = 15;
  }
}

message TextSegment {
  string text = 1;
}

message MentionSegment {
  int64 user_id = 1;
  string name = 2;
}

message MentionAllSegment {}

message FaceSegment {
  string face_id = 1;
  bool is_large = 2;
  // QQ 给的表情名（如「微笑」），客户端本地没有这个表情时显示。
  string name = 3;
}

message ReplySegment {
  int64 seq = 1;
  int64 sender_id = 2;
}

message ImageSegment {
  MediaInfo media = 1;
  uint32 width = 2;
  uint32 height = 3;
  string summary = 4;
  bool sticker = 5;
}

message RecordSegment {
  MediaInfo media = 1;
  uint32 duration_sec = 2;
}

message VideoSegment {
  MediaInfo media = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 duration_sec = 4;
}

message FileSegment {
  MediaInfo media = 1;
  string name = 2;
  uint64 size = 3;
}

message ForwardSegment {
  string forward_id = 1;
  string title = 2;
  repeated string preview = 3;
  string summary = 4;
}

message MarketFaceSegment {
  string emoji_id = 1;
  int64 package_id = 2;
  string key = 3;
  string summary = 4;
  MediaInfo media = 5;
}

message LightAppSegment {
  string app_name = 1;
  string json = 2;
}

message XmlSegment {
  int64 service_id = 1;
  string xml = 2;
}

message MarkdownSegment {
  string content = 1;
}

message UnknownSegment {
  string original = 1;
  string data_json = 2;
}

message Message {
  int64 chat_id = 1;
  // 会话内序号（QQ 的 message_seq），也是消息在会话里的唯一标识。
  int64 seq = 2;
  int64 sender_id = 3;
  int64 time = 4;
  MessageKind kind = 5;
  repeated Segment segments = 6;
  // 纯文本表示（预览、检索用）。
  string text = 7;
  int64 reply_to_seq = 8;
  // 标志位：1 图片 2 视频 4 语音 8 文件 16 链接 32 @我 64 @全体 128 表情。
  uint32 flags = 9;
  MessageState state = 10;
  int64 recalled_by = 11;
  int64 recalled_at = 12;
  // 最后一次变更时的 chat_pts。
  int64 version = 13;
  // 表情回应（QQ 的"贴表情"）。
  repeated Reaction reactions = 14;
  // 发送者当时的显示名（群名片，没有就昵称）；会话列表预览用，可能为空。
  string sender_name = 15;
}

message Reaction {
  string emoji_id = 1;
  uint32 count = 2;
  // 自己是否也点了这个表情。
  bool me = 3;
}

// 会话里的服务事件（QQ 的"小灰条"）：入群、退群、禁言、戳一戳、设精华、群文件上传等。
// 没有 QQ 的消息 seq，客户端按时间与消息穿插显示；与消息共用会话的 chat_pts 版本号（同样经差量 / 推送同步）。
message ChatEvent {
  int64 id = 1;
  int64 chat_id = 2;
  // member_join / member_leave / admin_set / admin_unset / mute / unmute / card_change / title / group_name /
  // essence_add / essence_remove / poke / friend_add / group_file / gray_tip
  string kind = 3;
  // unix 秒。
  int64 time = 4;
  // 谁做的（例如邀请人、踢人的管理员、戳人的人）；0 表示不适用。
  int64 actor_id = 5;
  // 对谁（例如被禁言、被戳的人）；0 表示不适用。
  int64 target_id = 6;
  // 相关的消息（例如被设为精华的那条）；0 表示没有。
  int64 ref_seq = 7;
  // 其余信息（JSON），例如禁言秒数、新旧群名片、戳一戳的文字、群文件的名字和大小。
  string data_json = 8;
  int64 version = 9;
  // 群文件：服务端存档的下载状态与内容。
  MediaInfo media = 10;
}

// 会话（Telegram 的 dialog）。
message Dialog {
  int64 chat_id = 1;
  int64 qq_account_id = 2;
  Scene scene = 3;
  int64 peer_id = 4;
  int64 top_seq = 5;
  int64 top_time = 6;
  uint32 unread_count = 7;
  // 未读里 @我 的条数。
  uint32 unread_mentions = 8;
  int64 read_inbox_max_seq = 9;
  bool pinned = 10;
  string notify_policy = 11;
  // 该会话消息流已分配到的序号；比本地缓存的大说明有消息更新没收到。
  int64 chat_pts = 12;
  // 会话行最后一次变更时的全局 pts。
  int64 dialog_pts = 13;
  Message top_message = 14;
  // 草稿（多设备同步）；没有草稿时不设置。
  Draft draft = 15;
  // 未读里 @全体成员 的条数（不含同时 @我 的）。
  uint32 unread_mention_all = 16;
  // 未读里回复我的条数。
  uint32 unread_replies = 17;
  // @全体成员 是否提醒。
  bool mention_all_notify = 18;
  // 置顶时间（unix 秒）；置顶会话按它倒序排。
  int64 pinned_at = 19;
}

// 草稿：文本、@、表情和回复对象（媒体不存草稿）。
message Draft {
  repeated OutgoingSegment segments = 1;
  int64 reply_to_seq = 2;
  // unix 秒。
  int64 updated_at = 3;
}

message Peer {
  int64 qq_account_id = 1;
  PeerKind kind = 2;
  int64 peer_id = 3;
  string name = 4;
  string remark = 5;
  bool is_friend = 6;
  uint32 member_count = 7;
  string avatar_sha256 = 8;
  int64 pts = 9;
  // 个性签名（好友）/ 群简介。
  string sign = 10;
  // 群：全员禁言中（群主、管理员仍可发言）。
  bool mute_all = 11;
  // 群：自己被禁言到（unix 秒，0 = 没被禁言）。
  int64 self_muted_until = 12;
  // 群：自己的身份 owner / admin / member（空 = 还不知道）。
  string self_role = 13;
}

// 墓碑：告诉客户端某一行已经被删除。
message Tombstone {
  int64 pts = 1;
  string entity = 2;
  string key = 3;
}

// ---- 发送（docs/design.md 4.7"发送幂等"） ----

// 外发消息里的媒体只引用 sha256：客户端先用 MediaService.PrepareUpload 秒传或上传。
message OutgoingMedia {
  string sha256 = 1;
  // 文件名（文件必填，其余可选）。
  string name = 2;
  // 语音时长（秒）。
  uint32 duration_sec = 3;
  // 图片按表情发送。
  bool sticker = 4;
  // 图片的预览文字（例如"[动画表情]"）。
  string summary = 5;
}

message OutgoingSegment {
  oneof kind {
    string text = 1;
    int64 mention_user_id = 2;
    bool mention_all = 3;
    string face_id = 4;
    OutgoingMedia image = 5;
    // 语音、视频、文件必须单独成条，也不能带回复。
    OutgoingMedia record = 6;
    OutgoingMedia video = 7;
    OutgoingMedia file = 8;
    // 合并转发（打包转发）：由服务端 ForwardMessages 生成，客户端只读（显示发件箱时用）。
    OutgoingForward forward = 9;
  }
}

message OutgoingForward {
  repeated OutgoingForwardNode nodes = 1;
}

message OutgoingForwardNode {
  int64 user_id = 1;
  string nickname = 2;
  repeated OutgoingSegment segments = 3;
}

enum OutboxState {
  OUTBOX_STATE_UNSPECIFIED = 0;
  // 已进入服务端发件箱，等待发往 QQ（QQ 不在线时会一直等）。
  OUTBOX_STATE_PENDING = 1;
  OUTBOX_STATE_SENDING = 2;
  OUTBOX_STATE_SENT = 3;
  // 发送失败：用同一个 client_random_id 再调一次 SendMessage 即重试。
  OUTBOX_STATE_FAILED = 4;
}

// 发件箱条目。按全局 pts 同步，所以所有设备都能看到"发送中 / 已发送 / 失败"，断线重连后也能追平。
message OutboxEntry {
  int64 pts = 1;
  int64 client_random_id = 2;
  int64 chat_id = 3;
  OutboxState state = 4;
  // 发送成功后这条消息在会话里的 seq（消息本身经 chat_pts 推送，两者到达的先后不固定）。
  int64 seq = 5;
  string error = 6;
  // unix 秒。
  int64 created_at = 7;
  repeated OutgoingSegment segments = 8;
  int64 reply_to_seq = 9;
}
