syntax = "proto3";

package qqbridge.v1;

import "qqbridge/v1/common.proto";

// 联系人与资料（docs/design.md 4.8 ContactService）。服务端不在后台逐个爬取资料，只在需要时取：
// - 好友列表、群列表各一次请求拿全，每天刷新一次（也可 RefreshContacts 手动刷新）；
// - 头像在打开会话（DialogService.SetActiveChat）时按需下载，一天最多一次；
// - 客户端打开资料页时带 refresh = true：缓存超过 10 分钟就当场向 QQ 刷新再返回。
// 资料变化（含头像）同时经 Subscribe 的 PeerUpdate 推送，会话列表和聊天页能直接更新。
service ContactService {
  rpc ListFriends(ListFriendsRequest) returns (ListFriendsResponse);
  rpc ListGroups(ListGroupsRequest) returns (ListGroupsResponse);
  rpc GetUserProfile(GetUserProfileRequest) returns (GetUserProfileResponse);
  rpc GetGroupProfile(GetGroupProfileRequest) returns (GetGroupProfileResponse);
  rpc ListGroupMembers(ListGroupMembersRequest) returns (ListGroupMembersResponse);
  // 立即从 QQ 刷新好友列表和群列表（例如用户下拉刷新联系人页）。
  rpc RefreshContacts(RefreshContactsRequest) returns (RefreshContactsResponse);
  // 一批人的头像（聊天页显示到谁就要谁的）：超过一天没检查过的才从 QQ 头像服务下载，不经 QQ 协议。一次最多 50 个。
  rpc GetAvatars(GetAvatarsRequest) returns (GetAvatarsResponse);
  // 群公告、群精华、群文件：打开对应页面时当场向 QQ 拉（不缓存列表）。
  rpc ListGroupNotices(ListGroupNoticesRequest) returns (ListGroupNoticesResponse);
  rpc ListGroupEssence(ListGroupEssenceRequest) returns (ListGroupEssenceResponse);
  rpc ListGroupFiles(ListGroupFilesRequest) returns (ListGroupFilesResponse);
  // 群相册：相册列表、某个相册里的照片 / 视频（按上传批次分页，图片链接是 QQ 的公开链接）。
  rpc ListGroupAlbums(ListGroupAlbumsRequest) returns (ListGroupAlbumsResponse);
  rpc ListGroupAlbumMedia(ListGroupAlbumMediaRequest) returns (ListGroupAlbumMediaResponse);
  // 下载一个群文件到服务端（已下过的直接返回）；完成后按 sha256 取。大文件可能要一会儿。
  rpc FetchGroupFile(FetchGroupFileRequest) returns (FetchGroupFileResponse);
  // 管理群文件（QQ 那边按权限判断：群主、管理员能管所有文件，成员只能管自己上传的；建删文件夹只有群主、管理员）。
  // 注意：QQ 的 file_id 每次列出都不一样，移动、重命名后也会变，客户端操作完重新列一次。
  rpc DeleteGroupFiles(DeleteGroupFilesRequest) returns (DeleteGroupFilesResponse);
  rpc MoveGroupFiles(MoveGroupFilesRequest) returns (MoveGroupFilesResponse);
  rpc RenameGroupFile(RenameGroupFileRequest) returns (RenameGroupFileResponse);
  rpc CreateGroupFolder(CreateGroupFolderRequest) returns (CreateGroupFolderResponse);
  rpc DeleteGroupFolder(DeleteGroupFolderRequest) returns (DeleteGroupFolderResponse);
  // 删除好友（同时从 QQ 删除，对方的好友列表里也会没有你）。
  rpc DeleteFriend(DeleteFriendRequest) returns (DeleteFriendResponse);
}

message ListFriendsRequest {}

message ListFriendsResponse {
  repeated Peer friends = 1;
  // QQ 里的好友分组（按 QQ 里的顺序）。"特别关心"是一个额外的分组，里面的人同时也在自己原本的分组里。
  repeated FriendCategory categories = 2;
}

message FriendCategory {
  int32 id = 1;
  string name = 2;
  int32 sort = 3;
  repeated int64 user_ids = 4;
  // 特别关心（id 9999）。
  bool special_care = 5;
}

message DeleteFriendRequest {
  int64 user_id = 1;
}

message DeleteFriendResponse {}

message ListGroupsRequest {}

message ListGroupsResponse {
  repeated Peer groups = 1;
}

message GetUserProfileRequest {
  int64 user_id = 1;
  bool refresh = 2;
}

message UserProfile {
  Peer peer = 1;
  // unknown / male / female。
  string sex = 2;
  uint32 age = 3;
  uint32 level = 4;
  // 上次从 QQ 刷新的时间（unix 秒，0 = 从没刷新过）。
  int64 refreshed_at = 5;
}

message GetUserProfileResponse {
  UserProfile profile = 1;
  // 想刷新但 QQ 离线或请求失败：返回的是缓存。
  bool stale = 2;
}

message GetGroupProfileRequest {
  int64 group_id = 1;
  bool refresh = 2;
}

message GroupProfile {
  Peer peer = 1;
  uint32 max_member_count = 2;
  int64 owner_id = 3;
  int64 refreshed_at = 4;
}

message GetGroupProfileResponse {
  GroupProfile profile = 1;
  bool stale = 2;
}

message GroupMember {
  int64 user_id = 1;
  string nickname = 2;
  // 群名片（为空时显示昵称）。
  string card = 3;
  // owner / admin / member。
  string role = 4;
  string title = 5;
  string level = 6;
  int64 joined_at = 7;
  int64 last_sent_at = 8;
  // QQ 机器人（官方机器人，消息带按钮 / markdown）。
  bool is_robot = 9;
}

message ListGroupMembersRequest {
  int64 group_id = 1;
  bool refresh = 2;
  int32 offset = 3;
  int32 limit = 4;
}

message ListGroupMembersResponse {
  repeated GroupMember members = 1;
  uint32 total = 2;
  bool stale = 3;
}

message RefreshContactsRequest {}

message RefreshContactsResponse {
  uint32 friends = 1;
  uint32 groups = 2;
}

message GetAvatarsRequest {
  repeated int64 user_ids = 1;
  // 群头像（联系人页的群列表）。
  repeated int64 group_ids = 2;
}

message UserAvatar {
  int64 user_id = 1;
  string sha256 = 2;
}

message GetAvatarsResponse {
  repeated UserAvatar avatars = 1;
  // 群头像：user_id 字段放群号。
  repeated UserAvatar groups = 2;
}

message ListGroupNoticesRequest {
  int64 group_id = 1;
}

message GroupNotice {
  string id = 1;
  int64 sender_id = 2;
  string sender_name = 3;
  // unix 秒。
  int64 time = 4;
  string text = 5;
  // 公告里的图片（QQ 的公开链接）。
  repeated string image_urls = 6;
  // 需要群成员确认。
  bool confirm_required = 7;
  uint32 read_count = 8;
  // 自己已读 / 已确认。
  bool read_by_me = 9;
  // 置顶。
  bool pinned = 10;
}

message ListGroupNoticesResponse {
  repeated GroupNotice notices = 1;
}

message ListGroupEssenceRequest {
  int64 group_id = 1;
}

message GroupEssence {
  // 在群里的 seq（存档里有这条时 message 也带上）。
  int64 seq = 1;
  int64 sender_id = 2;
  string sender_name = 3;
  string operator_name = 4;
  // 设为精华的时间（unix 秒）。
  int64 time = 5;
  // 存档里的原消息（能显示图片、表情等）；没存档时为空，用下面的 text / image_urls。
  Message message = 6;
  string text = 7;
  repeated string image_urls = 8;
}

message ListGroupEssenceResponse {
  repeated GroupEssence items = 1;
}

message ListGroupFilesRequest {
  int64 group_id = 1;
  // 空 = 根目录。
  string folder_id = 2;
}

message GroupFolder {
  string id = 1;
  string name = 2;
  uint32 file_count = 3;
  int64 modify_time = 4;
  string creator_name = 5;
}

message GroupFile {
  string id = 1;
  uint32 busid = 2;
  string name = 3;
  uint64 size = 4;
  int64 modify_time = 5;
  // 过期时间（unix 秒，0 = 永久）。
  int64 dead_time = 6;
  int64 uploader_id = 7;
  string uploader_name = 8;
  uint32 download_count = 9;
  // 服务端已存过的话是它的 sha256。
  string sha256 = 10;
}

message ListGroupFilesResponse {
  repeated GroupFolder folders = 1;
  repeated GroupFile files = 2;
}

message FetchGroupFileRequest {
  int64 group_id = 1;
  string file_id = 2;
  uint32 busid = 3;
  string name = 4;
  // 文件大小：服务端按"群 + 文件名 + 大小"认下载过的文件（QQ 的 file_id 每次列出都不一样）。
  uint64 size = 5;
}

message FetchGroupFileResponse {
  string sha256 = 1;
  uint64 size = 2;
  string mime = 3;
}

message DeleteGroupFilesRequest {
  int64 group_id = 1;
  repeated string file_ids = 2;
}

message MoveGroupFilesRequest {
  int64 group_id = 1;
  repeated string file_ids = 2;
  // 现在所在的文件夹（"" = 根目录）。
  string from_folder_id = 3;
  // 要移到的文件夹（"" = 根目录）。
  string to_folder_id = 4;
}

message RenameGroupFileRequest {
  int64 group_id = 1;
  string file_id = 2;
  // 所在的文件夹（"" = 根目录）。
  string folder_id = 3;
  string new_name = 4;
  // 原来的文件名和大小：改名后服务端把下载过的记录对到新名字上。
  string name = 5;
  uint64 size = 6;
}

message CreateGroupFolderRequest {
  int64 group_id = 1;
  string name = 2;
}

message CreateGroupFolderResponse {
  GroupFolder folder = 1;
}

message DeleteGroupFolderRequest {
  int64 group_id = 1;
  string folder_id = 2;
}

// 批量操作：成功的个数；失败的 id 和原因（例如没有权限）。
message DeleteGroupFilesResponse {
  uint32 succeeded = 1;
  repeated GroupFileOpFailure failures = 2;
}

message MoveGroupFilesResponse {
  uint32 succeeded = 1;
  repeated GroupFileOpFailure failures = 2;
}

// 单个操作失败时直接返回错误。
message RenameGroupFileResponse {}

message DeleteGroupFolderResponse {}

message GroupFileOpFailure {
  string file_id = 1;
  string reason = 2;
}

message ListGroupAlbumsRequest {
  int64 group_id = 1;
}

message GroupAlbum {
  string id = 1;
  string name = 2;
  string desc = 3;
  string cover_url = 4;
  uint32 count = 5;
  int64 creator_id = 6;
  string creator_name = 7;
  // unix 秒。
  int64 updated_at = 8;
}

message ListGroupAlbumsResponse {
  repeated GroupAlbum albums = 1;
}

message ListGroupAlbumMediaRequest {
  int64 group_id = 1;
  string album_id = 2;
  // 翻页：上一页返回的 next_cursor（空 = 从最新开始）。
  string cursor = 3;
}

message GroupAlbumMedia {
  string id = 1;
  // 列表里显示的小图（约 400px）和看大图用的原图。
  string thumb_url = 2;
  string url = 3;
  uint32 width = 4;
  uint32 height = 5;
  bool is_video = 6;
  string video_url = 7;
  int64 uploader_id = 8;
  string uploader_name = 9;
  // unix 秒。
  int64 time = 10;
  string batch_id = 11;
}

message ListGroupAlbumMediaResponse {
  repeated GroupAlbumMedia media = 1;
  string next_cursor = 2;
  bool has_more = 3;
  string album_name = 4;
}
