; QQ 容器里的四个进程：虚拟显示、PulseAudio、AV Host（通话引擎）、NapCat（QQ 主进程）。
; 所有日志都转到容器 stdout，用 docker logs 查看。

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/qqbridge/supervisord.pid

[unix_http_server]
file=/run/qqbridge/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/qqbridge/supervisor.sock

[program:xvfb]
command=/usr/bin/Xvfb :1 -screen 0 1280x800x24 +extension GLX +render -nolisten tcp
user=napcat
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pulseaudio]
command=/app/qqbridge/run-pulseaudio.sh
user=napcat
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:pulse-anchor]
command=/app/qqbridge/run-pulse-anchor.sh
user=napcat
priority=25
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:avhost]
command=/app/qqbridge/run-avhost.sh
user=napcat
priority=30
autorestart=true
startsecs=5
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:napcat]
command=/app/qqbridge/run-napcat.sh
user=napcat
priority=40
autorestart=true
startsecs=10
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
redirect_stderr=true
