# macOS 版发布：归档、Developer ID 签名、Apple 公证、打 DMG（脚本见 macos/release.sh）。
# 触发：推 mac-v* 标签（同时发 GitHub Release），或在 Actions 页面手动运行（只上传构建产物）。
#
# 需要的仓库 Secrets（App Store Connect → 用户和访问 → 集成 → 团队密钥，角色 Admin：云端 Developer ID 签名要这个权限）：
#   ASC_KEY_ID      密钥 ID
#   ASC_ISSUER_ID   Issuer ID
#   ASC_KEY_P8      下载的 AuthKey_XXXX.p8 的全文
name: macOS release

on:
  push:
    tags: ["mac-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    # 工程要 macOS 27 / iOS 27 SDK：GitHub 的 Xcode 27 预览镜像（2026-10 时还是预览，见 actions/runner-images#14404）。
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 版本
        run: xcodebuild -version

      - name: 装 XcodeGen
        run: brew install xcodegen

      - name: 写入 App Store Connect API 密钥
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_KEY_P8" || { echo "缺少 Secret ASC_KEY_P8" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      - name: 归档、签名、公证、打 DMG
        id: build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" ./macos/release.sh

      - name: 上传日志（失败时也传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-logs
          path: ${{ runner.temp }}/release/*/logs
          if-no-files-found: ignore

      - name: 上传 DMG
        uses: actions/upload-artifact@v4
        with:
          name: BetterChat-Mac-dmg
          path: ${{ steps.build.outputs.dmg }}

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.dmg }}" --title "BetterChat for Mac ${GITHUB_REF_NAME#mac-v}" --notes "自动构建：Developer ID 签名并经 Apple 公证。仅 Apple 芯片、macOS 27 及以上。"

      - name: 清理密钥
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
