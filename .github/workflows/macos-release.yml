# macOS 版发布：归档、Developer ID 签名、Apple 公证、打 DMG（脚本见 macos/release.sh）。
# 触发：推 mac-v* 标签（同时发 GitHub Release），或在 Actions 页面手动运行（只上传构建产物）。
#
# 需要的仓库 Secrets（App Store Connect → 用户和访问 → 集成 → 团队密钥，角色 Admin：云端 Developer ID 签名要这个权限）：
#   ASC_KEY_ID      密钥 ID
#   ASC_ISSUER_ID   Issuer ID
#   ASC_KEY_P8      下载的 AuthKey_XXXX.p8 的全文
#   DEVELOPER_ID_P12 / DEVELOPER_ID_P12_PASSWORD
#                   Developer ID Application 证书（含私钥，base64 后的 .p12）和导出密码。
#                   2026-10-16 实测：API 团队密钥不能用云端管理的分发证书（Cloud signing permission error），必须自带证书；
#   APPLE_DEVELOPMENT_P12 / APPLE_DEVELOPMENT_P12_PASSWORD
#                   团队 L7V7ULL3VT 的一张 Apple Development 证书（含私钥）：归档时用，免得 Xcode 每次在 CI 新建一张（见 .github/scripts/import-certs.sh）。
#   MAC_DEVELOPER_ID_PROFILE
#                   Developer ID 描述文件（base64 后的 .provisionprofile；开发者网站 → 描述文件 → Developer ID → Mac Catalyst，
#                   App ID com.xiaomouz.betterchat.mac，勾选上面那张证书）。API 密钥自动生成不了这种描述文件。
# 自动更新（Sparkle）和 R2 托管：
#   Secrets：SPARKLE_ED_KEY（generate_keys -x 导出的私钥那一行）、R2_ACCOUNT_ID、R2_ACCESS_KEY_ID、R2_SECRET_ACCESS_KEY、R2_BUCKET
#   Variables：SPARKLE_PUBLIC_KEY（公钥）、SPARKLE_BASE_URL（R2 公开地址，到 mac/ 这一层，例如 https://dl.example.com/mac）
#   没配这些时照常出 DMG，只是不签 Sparkle、不传 R2。
name: macOS release

on:
  push:
    tags: ["mac-v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: macos-release
  cancel-in-progress: false

jobs:
  release:
    # 工程要 macOS 27 / iOS 27 SDK：GitHub 的 xcode-27 镜像（预览标签，2026-10-16 实测是 Xcode 27.0 正式版 27A266a）。
    runs-on: xcode-27
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Xcode 版本
        run: xcodebuild -version

      - name: 装 XcodeGen
        run: brew install xcodegen

      - name: 写入 App Store Connect API 密钥
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_KEY_P8" || { echo "缺少 Secret ASC_KEY_P8" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      - name: 导入签名证书（临时钥匙串）
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
          APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
          APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
        run: .github/scripts/import-certs.sh DEVELOPER_ID_P12 DEVELOPER_ID_P12_PASSWORD APPLE_DEVELOPMENT_P12 APPLE_DEVELOPMENT_P12_PASSWORD

      - name: 写入 Developer ID 描述文件
        env:
          PROFILE: ${{ secrets.MAC_DEVELOPER_ID_PROFILE }}
        run: |
          test -n "$PROFILE" || { echo "缺少 Secret MAC_DEVELOPER_ID_PROFILE" >&2; exit 1; }
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/developer-id.provisionprofile"

      - name: 更新说明（上一个 mac-v 标签之后的提交标题）
        run: |
          prev=$(git describe --tags --abbrev=0 --match 'mac-v*' HEAD^ 2>/dev/null || true)
          range=${prev:+$prev..}HEAD
          {
            echo 'RELEASE_NOTES<<NOTES_END'
            git log --no-merges --format='• %s' "$range" -- ios/QQBridge/App ios/QQBridgeKit macos | cut -c1-200 | head -40
            echo 'NOTES_END'
          } >>"$GITHUB_ENV"

      - name: 归档、签名、公证、打 DMG、发布更新
        id: build
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          RELEASE_DIR: ${{ runner.temp }}/release
          SPARKLE_PUBLIC_KEY: ${{ vars.SPARKLE_PUBLIC_KEY }}
          SPARKLE_FEED_URL: ${{ vars.SPARKLE_BASE_URL && format('{0}/appcast.xml', vars.SPARKLE_BASE_URL) || '' }}
          SPARKLE_DOWNLOAD_BASE: ${{ vars.SPARKLE_BASE_URL }}
          SPARKLE_ED_KEY: ${{ secrets.SPARKLE_ED_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" DEVELOPER_ID_PROFILE="$RUNNER_TEMP/developer-id.provisionprofile" ./macos/release.sh

      - name: 上传日志（失败时也传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: macos-release-logs
          path: ${{ runner.temp }}/release/*/logs
          if-no-files-found: ignore

      - name: 上传 DMG
        uses: actions/upload-artifact@v4
        with:
          name: BetterChat-Mac-dmg
          path: ${{ steps.build.outputs.dmg }}

      - name: 发布到 GitHub Release
        if: startsWith(github.ref, 'refs/tags/mac-v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" "${{ steps.build.outputs.dmg }}" --title "BetterChat for Mac ${GITHUB_REF_NAME#mac-v}" --notes "自动构建：Developer ID 签名并经 Apple 公证。仅 Apple 芯片、macOS 27 及以上。"

      - name: 清理密钥
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
