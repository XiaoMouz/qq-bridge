# iOS 发 TestFlight（脚本见 ios/release-testflight.sh）。
# 触发：推 ios-v* 标签，或在 Actions 页面手动运行。版本号和构建号以 ios/QQBridge/project.yml 为准，推之前先改好；
# 同一版本下构建号必须比上次上传的大。
# Secrets 和 macOS 发布共用：ASC_KEY_ID、ASC_ISSUER_ID、ASC_KEY_P8（App Store Connect 团队密钥，Admin 角色），
# 以及 APPLE_DEVELOPMENT_P12 / APPLE_DEVELOPMENT_P12_PASSWORD（归档用的开发证书，免得 Xcode 每次在 CI 新建一张）。
name: iOS TestFlight

on:
  push:
    tags: ["ios-v*"]
  workflow_dispatch:

concurrency:
  group: ios-testflight
  cancel-in-progress: false

jobs:
  upload:
    # 工程要 iOS 27 SDK：GitHub 的 xcode-27 镜像（2026-10-16 实测 Xcode 27.0 正式版 27A266a，上传 TestFlight 成功；App Store 分发证书用 API 密钥的云端证书即可）。
    runs-on: xcode-27
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Xcode 版本
        run: xcodebuild -version

      - name: 装 XcodeGen
        run: brew install xcodegen

      - name: 写入 App Store Connect API 密钥
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
        run: |
          test -n "$ASC_KEY_P8" || { echo "缺少 Secret ASC_KEY_P8" >&2; exit 1; }
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8"

      - name: 导入开发证书（临时钥匙串）
        env:
          APPLE_DEVELOPMENT_P12: ${{ secrets.APPLE_DEVELOPMENT_P12 }}
          APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
        run: .github/scripts/import-certs.sh APPLE_DEVELOPMENT_P12 APPLE_DEVELOPMENT_P12_PASSWORD

      - name: 归档并上传
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          RELEASE_DIR: ${{ runner.temp }}/release
        run: ASC_KEY_PATH="$RUNNER_TEMP/asc/AuthKey_$ASC_KEY_ID.p8" ./ios/release-testflight.sh

      - name: 上传日志（失败时也传）
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-testflight-logs
          path: ${{ runner.temp }}/release/*/logs
          if-no-files-found: ignore

      - name: 清理密钥
        if: always()
        run: |
          rm -rf "$RUNNER_TEMP/asc"
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
