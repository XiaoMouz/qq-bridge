# Xcode 工程由 XcodeGen 生成：cd ios/QQBridge && xcodegen，生成 BetterChat.xcodeproj（不进 git）。
name: BetterChat
options:
  bundleIdPrefix: com.xiaomouz
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.16"
    CURRENT_PROJECT_VERSION: "24"
packages:
  QQBridgeKit:
    path: ../QQBridgeKit
  # 超级表情（QQ 的 lottie 动画）。
  Lottie:
    url: https://github.com/airbnb/lottie-spm
    from: "4.5.0"
  # 通话：经 LiveKit 与 QQ 那边的通话网关互通语音。
  LiveKit:
    url: https://github.com/livekit/client-sdk-swift
    from: "2.0.0"
schemes:
  BetterChat:
    build:
      targets:
        BetterChat: all
    test:
      config: Debug
      targets: [BetterChatTests]
      environmentVariables:
        BETTERCHAT_STATE_TESTS: "1"
targets:
  BetterChatTests:
    type: bundle.unit-test
    platform: iOS
    sources: [Tests]
    dependencies:
      - target: BetterChat
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaomouz.betterchat.tests
        DEVELOPMENT_TEAM: L7V7ULL3VT
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: "1,2"
  BetterChat:
    type: application
    platform: iOS
    sources:
      - App
      - Shared
      # QQ 自带的小黄脸静态图（sNNN.png），按文件夹原样打包。
      - path: Resources/Assets.xcassets
      - path: Resources/QQFaces
        type: folder
        buildPhase: resources
    dependencies:
      - package: QQBridgeKit
        product: QQBridgeKit
      - package: QQBridgeKit
        product: QQBridgeProto
      - package: Lottie
        product: Lottie
      - package: LiveKit
        product: LiveKit
      # 通知扩展：通知显示发送者头像（通讯通知）。
      - target: NotificationService
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BetterChat
        # 版本号跟着构建设置（MARKETING_VERSION / CURRENT_PROJECT_VERSION）；每次发布 TestFlight 升一个小版本（1.2 → 1.3），构建号同时 +1。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: 按住麦克风录语音消息
        NSCameraUsageDescription: 拍照或录像后发送到聊天
        NSPhotoLibraryUsageDescription: 选择要发送的照片
        NSPhotoLibraryAddUsageDescription: 把聊天里的图片保存到相册
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        UILaunchScreen: {}
        # 视频后台播放、画中画。
        # voip：来电的 VoIP 推送（PushKit）交给 CallKit。
        UIBackgroundModes: [audio, voip]
        # 通讯通知（通知左边显示发送者头像）：通知扩展用发消息的意图生成通知内容。
        NSUserActivityTypes: [INSendMessageIntent]
        # 只用系统自带的 HTTPS，属于豁免加密；上传 TestFlight 时不用再回答出口合规问题。
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # 服务端经 Tailscale 的 HTTPS 访问；开发时模拟器直连本机 http://127.0.0.1:8080。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaomouz.betterchat
        # 签名：ShenZhen CodeNav 团队，Xcode 自动管理证书和描述文件。
        DEVELOPMENT_TEAM: L7V7ULL3VT
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/QQBridge.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
  NotificationService:
    type: app-extension
    platform: iOS
    sources:
      - NotificationService
      - Shared
    info:
      path: NotificationService/Info.plist
      properties:
        CFBundleDisplayName: BetterChat 通知
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDevelopmentRegion: zh-Hans
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaomouz.betterchat.NotificationService
        DEVELOPMENT_TEAM: L7V7ULL3VT
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        TARGETED_DEVICE_FAMILY: "1,2"
        SKIP_INSTALL: YES
