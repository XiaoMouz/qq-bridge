# Xcode 工程由 XcodeGen 生成：cd ios/QQBridge && xcodegen，生成 BetterChat.xcodeproj（不进 git）。
name: BetterChat
options:
  bundleIdPrefix: com.xiaomouz
  deploymentTarget:
    iOS: "26.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.3"
    CURRENT_PROJECT_VERSION: "8"
packages:
  QQBridgeKit:
    path: ../QQBridgeKit
targets:
  BetterChat:
    type: application
    platform: iOS
    sources:
      - App
      # QQ 自带的小黄脸静态图（sNNN.png），按文件夹原样打包。
      - path: Resources/Assets.xcassets
      - path: Resources/QQFaces
        type: folder
        buildPhase: resources
    dependencies:
      - package: QQBridgeKit
        product: QQBridgeKit
      - package: QQBridgeKit
        product: QQBridgeProto
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: BetterChat
        # 版本号跟着构建设置（MARKETING_VERSION / CURRENT_PROJECT_VERSION）；每次发布 TestFlight 升一个小版本（1.2 → 1.3），构建号同时 +1。
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSMicrophoneUsageDescription: 按住麦克风录语音消息
        NSPhotoLibraryUsageDescription: 选择要发送的照片
        NSPhotoLibraryAddUsageDescription: 把聊天里的图片保存到相册
        CFBundleDevelopmentRegion: zh-Hans
        CFBundleLocalizations: [zh-Hans]
        UILaunchScreen: {}
        # 只用系统自带的 HTTPS，属于豁免加密；上传 TestFlight 时不用再回答出口合规问题。
        ITSAppUsesNonExemptEncryption: false
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          [UIInterfaceOrientationPortrait, UIInterfaceOrientationPortraitUpsideDown, UIInterfaceOrientationLandscapeLeft, UIInterfaceOrientationLandscapeRight]
        # 服务端经 Tailscale 的 HTTPS 访问；开发时模拟器直连本机 http://127.0.0.1:8080。
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.xiaomouz.betterchat
        # 签名：ShenZhen CodeNav 团队，Xcode 自动管理证书和描述文件。
        DEVELOPMENT_TEAM: L7V7ULL3VT
        CODE_SIGN_STYLE: Automatic
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CODE_SIGN_ENTITLEMENTS: App/QQBridge.entitlements
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: NO
        ENABLE_PREVIEWS: YES
